[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "barcode-changer"
version = "0.1.6"
description = "CLI tool to read and change barcodes in image pairs from an input/ folder"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "opencv-python==4.8.1.78",
  "numpy==1.24.4",
  "huggingface_hub==0.20.3",
  "pyrxing==0.0.21",
  "ultralytics==8.0.228",
  "rawpy==0.18.1",
  "imageio==2.31.6",
  "zxing-cpp==2.3.0",
]

[project.scripts]
barcode-changer = "barcode_changer_tool.barcode_changer:main"
[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["barcode_changer_tool*", "barcode_reader*"]
